<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5068bd"/>
      <stop offset="0.22" stop-color="#6ea7d0"/>
      <stop offset="0.45" stop-color="#a9da65"/>
      <stop offset="0.64" stop-color="#f3ec4d"/>
      <stop offset="0.82" stop-color="#f5ad32"/>
      <stop offset="1" stop-color="#e45732"/>
    </linearGradient>
    <radialGradient id="hot1" cx="70%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f8e83e" stop-opacity="0.95"/>
      <stop offset="0.48" stop-color="#f7b331" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#d96a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot2" cx="36%" cy="68%" r="66%">
      <stop offset="0" stop-color="#5874c7" stop-opacity="0.92"/>
      <stop offset="0.46" stop-color="#79a4d2" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#90c968" stop-opacity="0"/>
    </radialGradient>
    <pattern id="checker" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#eef2f5"/>
      <rect width="9" height="9" fill="#dce3e9"/>
      <rect x="9" y="9" width="9" height="9" fill="#dce3e9"/>
    </pattern>
    <clipPath id="mainCrop">
      <rect x="150" y="118" width="720" height="570" rx="3"/>
    </clipPath>
    <clipPath id="regionShape">
      <path d="M239 238 L276 206 L324 215 L351 189 L391 202 L425 180 L470 190 L492 225 L545 236 L567 266 L617 268 L650 296 L688 302 L719 335 L758 342 L779 374 L815 381 L829 422 L808 451 L776 455 L760 488 L722 495 L702 532 L666 527 L637 548 L600 533 L576 554 L542 535 L512 543 L482 519 L445 524 L422 495 L383 498 L354 472 L320 468 L293 439 L266 425 L251 390 L224 368 L226 333 L211 309 Z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#26384d" flood-opacity="0.15"/>
    </filter>
    <style>
      .axis { stroke:#566574; stroke-width:2; }
      .tick { stroke:#566574; stroke-width:2; }
      .label { fill:#566574; font-family:Arial,sans-serif; font-size:15px; }
      .small { fill:#738292; font-family:Arial,sans-serif; font-size:13px; }
      .panelTitle { fill:#25364a; font-family:Arial,sans-serif; font-size:20px; font-weight:700; letter-spacing:1px; }
      .note { fill:#33475c; font-family:Arial,sans-serif; font-size:14px; }
      .boundary { fill:none; stroke:#7a3f54; stroke-width:2.6; stroke-linejoin:round; stroke-linecap:round; }
      .boundary2 { fill:none; stroke:#244f73; stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; }
    </style>
  </defs>

  <rect width="1280" height="820" fill="url(#paper)"/>
  <text x="64" y="58" class="panelTitle">Colorful map static export preview</text>
  <text x="64" y="84" class="small">Simplified visual confirmation: data texture + GeoJSON boundaries + coordinate axes</text>

  <!-- PNG output -->
  <g filter="url(#shadow)">
    <rect x="120" y="90" width="780" height="640" rx="6" fill="#fff"/>
    <rect x="150" y="118" width="720" height="570" fill="url(#checker)"/>
    <rect x="150" y="118" width="720" height="570" fill="#fff" opacity="0.12"/>
    <g clip-path="url(#mainCrop)">
      <rect x="150" y="118" width="720" height="570" fill="#fff"/>
      <path d="M239 238 L276 206 L324 215 L351 189 L391 202 L425 180 L470 190 L492 225 L545 236 L567 266 L617 268 L650 296 L688 302 L719 335 L758 342 L779 374 L815 381 L829 422 L808 451 L776 455 L760 488 L722 495 L702 532 L666 527 L637 548 L600 533 L576 554 L542 535 L512 543 L482 519 L445 524 L422 495 L383 498 L354 472 L320 468 L293 439 L266 425 L251 390 L224 368 L226 333 L211 309 Z" fill="url(#heat)" stroke="#52616f" stroke-width="2"/>
      <g clip-path="url(#regionShape)">
        <rect x="205" y="172" width="650" height="400" fill="url(#heat)" opacity="0.66"/>
        <ellipse cx="704" cy="288" rx="190" ry="126" fill="url(#hot1)"/>
        <ellipse cx="478" cy="416" rx="240" ry="150" fill="url(#hot2)"/>
        <path d="M210 355 C306 301 360 356 420 318 S540 310 586 351 S713 367 835 318 L850 430 C749 470 657 420 577 463 S403 489 302 446 Z" fill="#f7e642" opacity="0.45"/>
        <path d="M257 238 C341 260 360 296 432 278 S558 247 638 298 S768 332 842 285 L852 354 C753 381 676 357 604 334 S448 345 369 325 S285 307 214 291 Z" fill="#6a79c5" opacity="0.40"/>
        <path d="M350 492 C428 425 494 435 545 473 S646 520 732 466 L706 548 L533 571 L405 545 Z" fill="#f09c38" opacity="0.55"/>
        <path d="M251 385 C327 353 374 378 425 401 S514 432 568 403 S682 365 759 391" fill="none" stroke="#8fd563" stroke-width="24" opacity="0.45"/>
      </g>
      <!-- administrative boundaries at z=1 -->
      <path class="boundary" d="M252 315 L302 300 L346 319 L379 292 L426 311 L459 286 L502 300 L532 326 L568 320 L605 344 L639 331 L682 357 L721 347 L757 372 L738 402 L700 407 L677 438 L636 424 L607 448 L564 432 L530 453 L489 432 L446 449 L409 426 L374 436 L337 411 L298 409 L276 383 L241 363"/>
      <path class="boundary2" d="M345 218 L355 265 L343 311 L361 353 L347 395 L366 473"/>
      <path class="boundary2" d="M493 225 L487 267 L508 300 L497 347 L516 386 L503 431 L520 480 L507 537"/>
      <path class="boundary2" d="M618 269 L603 306 L620 341 L606 378 L628 417 L614 459 L638 511"/>
      <path class="boundary2" d="M699 304 L681 343 L699 378 L686 412 L707 452 L692 492"/>
      <!-- hole in a polygon -->
      <path d="M637 386 C655 371 679 374 689 390 C680 408 653 414 637 402 Z" fill="#fff" stroke="#7a3f54" stroke-width="2"/>
    </g>
    <!-- axes at z=2 -->
    <line x1="150" y1="688" x2="870" y2="688" class="axis"/>
    <line x1="150" y1="118" x2="150" y2="688" class="axis"/>
    <g class="tick">
      <line x1="150" y1="688" x2="150" y2="697"/><line x1="270" y1="688" x2="270" y2="697"/>
      <line x1="390" y1="688" x2="390" y2="697"/><line x1="510" y1="688" x2="510" y2="697"/>
      <line x1="630" y1="688" x2="630" y2="697"/><line x1="750" y1="688" x2="750" y2="697"/>
      <line x1="870" y1="688" x2="870" y2="697"/>
      <line x1="150" y1="118" x2="141" y2="118"/><line x1="150" y1="232" x2="141" y2="232"/>
      <line x1="150" y1="346" x2="141" y2="346"/><line x1="150" y1="460" x2="141" y2="460"/>
      <line x1="150" y1="574" x2="141" y2="574"/><line x1="150" y1="688" x2="141" y2="688"/>
    </g>
    <g class="label" text-anchor="middle">
      <text x="150" y="718">72°E</text><text x="270" y="718">84°E</text><text x="390" y="718">96°E</text>
      <text x="510" y="718">108°E</text><text x="630" y="718">120°E</text><text x="750" y="718">132°E</text><text x="870" y="718">136°E</text>
    </g>
    <g class="label" text-anchor="end">
      <text x="132" y="123">55°N</text><text x="132" y="237">47°N</text><text x="132" y="351">39°N</text>
      <text x="132" y="465">31°N</text><text x="132" y="579">23°N</text><text x="132" y="693">17°N</text>
    </g>
    <text x="507" y="748" class="small" text-anchor="middle">longitude (12 degree ticks)</text>
    <text x="83" y="402" class="small" transform="rotate(-90 83 402)" text-anchor="middle">latitude (8 degree ticks)</text>
  </g>
  <text x="150" y="112" class="small">PNG / outside crop = transparent</text>

  <!-- JPG comparison -->
  <g filter="url(#shadow)">
    <rect x="960" y="122" width="260" height="220" rx="6" fill="#fff"/>
    <rect x="982" y="148" width="216" height="170" fill="#fff" stroke="#c9d2dc"/>
    <path d="M1003 222 L1020 204 L1043 209 L1057 194 L1077 201 L1092 188 L1115 194 L1128 209 L1152 215 L1163 232 L1180 237 L1190 253 L1178 270 L1157 269 L1148 286 L1125 282 L1109 296 L1088 286 L1069 296 L1048 280 L1028 281 L1016 264 L1000 255 Z" fill="url(#heat)" stroke="#52616f" stroke-width="1.5"/>
    <path d="M1028 253 L1051 242 L1072 250 L1092 235 L1110 247 L1131 237 L1153 250 L1174 243" class="boundary" stroke-width="1.5"/>
    <path d="M1092 192 L1091 226 L1100 253 L1093 290" class="boundary2" stroke-width="1.4"/>
    <text x="982" y="137" class="small">JPG variant</text>
    <text x="982" y="334" class="small">outside crop = solid white</text>
  </g>

  <!-- layer order and parameter callout -->
  <g>
    <text x="960" y="410" class="panelTitle" font-size="18">Layer order</text>
    <rect x="960" y="432" width="260" height="46" rx="4" fill="#fff" stroke="#d4dce5"/>
    <rect x="978" y="447" width="18" height="18" fill="url(#heat)"/>
    <text x="1008" y="461" class="note">z0  data texture / color ramp</text>
    <rect x="960" y="486" width="260" height="46" rx="4" fill="#fff" stroke="#d4dce5"/>
    <line x1="978" y1="509" x2="996" y2="509" class="boundary"/>
    <text x="1008" y="514" class="note">z1  GeoJSON boundaries</text>
    <rect x="960" y="540" width="260" height="46" rx="4" fill="#fff" stroke="#d4dce5"/>
    <line x1="978" y1="563" x2="996" y2="563" class="axis"/>
    <text x="1008" y="568" class="note">z2  coordinate axes + ticks</text>
    <text x="960" y="632" class="small">Data extent: 72E-136E / 17N-55N</text>
    <text x="960" y="654" class="small">Projection: Web Mercator (EPSG:3857)</text>
    <text x="960" y="676" class="small">Output size follows projected aspect ratio</text>
  </g>

  <text x="64" y="790" class="small">This is a simplified shape-only preview for confirming composition and clipping behavior; actual GeoJSON and texture values will be supplied at export time.</text>
</svg>
